openapi: 3.0.3
info:
  title: Delivery Order API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/delivery-orders:
    post:
      summary: Create or retrieve an idempotent delivery order
      operationId: createDeliveryOrder
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: header
          name: X-Correlation-Id
          required: false
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: New order result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '200':
          description: Existing idempotent result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '409':
          description: Idempotency key reused with different content
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/delivery-orders/{orderId}:
    get:
      summary: Retrieve a delivery order
      operationId: getDeliveryOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order representation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [customerReference, sender, recipient, parcel, deliveryType]
      properties:
        customerReference: { type: string, minLength: 1, maxLength: 100 }
        sender: { $ref: '#/components/schemas/Party' }
        recipient: { $ref: '#/components/schemas/Party' }
        parcel:
          type: object
          required: [weightInGrams]
          properties:
            weightInGrams: { type: integer, minimum: 1 }
        deliveryType: { type: string, enum: [STANDARD, NEXT_DAY, SAME_DAY] }
    Party:
      type: object
      required: [name, postalCode, countryCode]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        postalCode: { type: string, pattern: '^\\d{4}\\s?[A-Za-z]{2}$' }
        countryCode: { type: string, enum: [NL] }
    OrderResponse:
      type: object
      required: [orderId, customerReference, status, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        customerReference: { type: string }
        status:
          type: string
          enum: [PRICING_PENDING, CONFIRMED, REJECTED, PRICING_UNAVAILABLE]
        price: { $ref: '#/components/schemas/Price' }
        rejectionCode: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    Price:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, example: 8.95 }
        currency: { type: string, example: EUR }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors: { type: object, additionalProperties: { type: string } }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 5s
      timeout: 3s
      retries: 10

  pricing-eligibility-api:
    build: ./pricing-eligibility-api
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  delivery-order-api:
    build: ./delivery-order-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery
      SPRING_DATASOURCE_USERNAME: delivery
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-delivery-local}
      PRICING_BASE_URL: http://pricing-eligibility-api:8081
    depends_on:
      postgres:
        condition: service_healthy
      pricing-eligibility-api:
        condition: service_healthy

volumes:
  postgres-data:
